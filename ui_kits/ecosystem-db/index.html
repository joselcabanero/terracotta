<!DOCTYPE html>
<!-- @dsCard group="UI Kit — Ecosystem Db" name="UI Kit — Ecosystem DB" subtitle="Interactive app recreation — login → home → startups → detail" viewport="1280x760" -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ecosystem DB — Startup Intelligence · UI Kit</title>
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="grid.css">
<style>
  html, body { margin:0; height:100%; background:#fff; }
  #root { height:100vh; }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:#DBDBDB; border:2px solid #fff; }
  @keyframes fadeIn { from { transform:translateY(5px); } to { transform:translateY(0); } }
  .page-transition { animation: fadeIn .15s ease-out both; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 1s linear infinite; }
  a { color: inherit; }
  select:focus, input:focus { outline:none; }

  /* ── International Typographic Style: ink + paper + one red, square, flat.
       Class/CSS-driven so states survive re-renders. ── */
  .eds-btn{font-family:var(--font-sans);font-weight:500;display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap;border-radius:0;border:1px solid transparent;transition:background .12s,color .12s,border-color .12s;}
  .eds-btn.md{font-size:14px;padding:9px 16px;}
  .eds-btn.sm{font-size:12px;padding:7px 12px;}
  .eds-btn.primary{background:#111;color:#fff;}
  .eds-btn.primary:hover{background:#000;}
  .eds-btn.outline{background:#fff;color:#111;border-color:#111;}
  .eds-btn.outline:hover{background:#F4F4F2;}
  .eds-btn.ghost{background:transparent;color:#4A4A4A;}
  .eds-btn.ghost:hover{background:#EAEAEA;color:#111;}
  .eds-btn.destructive{background:#E1251B;color:#fff;}
  .eds-btn.destructive:hover{background:#B71C13;}

  .eds-card{background:#fff;border:1px solid #DBDBDB;border-radius:0;transition:border-color .12s;}
  .eds-card.hoverable{cursor:pointer;}
  .eds-card.hoverable:hover{border-color:#111;}

  .eds-nav{display:flex;align-items:center;gap:10px;border-radius:0;text-decoration:none;cursor:pointer;color:#6F6F6F;border-left:3px solid transparent;transition:background .12s,color .12s,border-color .12s;}
  .eds-nav.collapsed{width:40px;height:36px;justify-content:center;}
  .eds-nav.expanded{width:100%;padding:7px 9px;justify-content:flex-start;}
  .eds-nav .eds-nav-label{font-size:12px;font-weight:500;color:#4A4A4A;white-space:nowrap;}
  .eds-nav:not(.disabled):not(.active):hover{background:#EAEAEA;color:#111;}
  .eds-nav:not(.disabled):not(.active):hover .eds-nav-label{color:#111;}
  .eds-nav.active{background:#F4F4F2;color:#111;border-left-color:#E1251B;}
  .eds-nav.active .eds-nav-label{color:#111;font-weight:700;}
  .eds-nav.disabled{opacity:.35;cursor:not-allowed;}

  .eds-newscard{display:flex;flex-direction:column;gap:5px;padding:12px;border:1px solid #DBDBDB;border-radius:0;background:#fff;height:120px;overflow:hidden;cursor:pointer;box-sizing:border-box;transition:border-color .12s;}
  .eds-newscard:hover{border-color:#111;}

  .eds-arow{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid #DBDBDB;min-height:44px;cursor:pointer;transition:background .12s;}
  .eds-arow:hover{background:#F4F4F2;}

  .eds-trow{background:#fff;border-top:1px solid #DBDBDB;transition:background .12s;}
  .eds-trow:hover{background:#F4F4F2;}
  .eds-link{font-weight:500;color:#111;cursor:pointer;text-decoration:none;border-bottom:2px solid #E1251B;padding-bottom:1px;}
  .eds-trow:hover .eds-link{color:#E1251B;}

  .eds-iconbtn{padding:6px;border-radius:0;background:none;border:none;cursor:pointer;color:#6F6F6F;display:flex;transition:background .12s,color .12s;}
  .eds-iconbtn:hover{background:#EAEAEA;color:#111;}

  .eds-filterbtn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;font-size:14px;border-radius:0;cursor:pointer;font-family:var(--font-sans);border:1px solid #111;background:#fff;color:#111;transition:all .12s;}
  .eds-filterbtn:hover{background:#F4F4F2;}
  .eds-filterbtn.on{background:#111;color:#fff;border-color:#111;}

  .eds-viewall{font-family:var(--font-mono);font-size:11px;color:#6F6F6F;cursor:pointer;text-decoration:none;transition:color .12s;}
  .eds-viewall:hover{color:#E1251B;}

  .eds-search-input:focus{border-color:#E1251B;box-shadow:0 0 0 1px #E1251B;}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="StartupsScreen.jsx"></script>
<script type="text/babel" src="DetailScreen.jsx"></script>

</body>
</html>
