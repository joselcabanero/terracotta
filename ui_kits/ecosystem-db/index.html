<!DOCTYPE html>
<!-- @dsCard group="UI Kit — Ecosystem Db" name="UI Kit — Ecosystem DB" subtitle="Interactive app recreation — login → home → startups → detail" viewport="1280x760" -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ecosystem DB — Startup Intelligence · UI Kit</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
  html, body { margin:0; height:100%; background:#fff; }
  #root { height:100vh; }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:#e5e5e5; border-radius:9999px; border:2px solid #fff; }
  @keyframes fadeIn { from { transform:translateY(5px); } to { transform:translateY(0); } }
  .page-transition { animation: fadeIn .15s ease-out both; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 1s linear infinite; }
  a { color: inherit; }
  select:focus, input:focus { outline:none; }

  /* ── Interactive states (class/CSS-driven so they survive re-renders) ── */
  .eds-btn{font-family:var(--font-sans);font-weight:500;display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap;border-radius:8px;border:1px solid transparent;transition:background .12s,color .12s,border-color .12s;}
  .eds-btn.md{font-size:14px;padding:8px 14px;}
  .eds-btn.sm{font-size:12px;padding:6px 11px;}
  .eds-btn.primary{background:#1E1E1E;color:#FFF9EE;}
  .eds-btn.primary:hover{background:#38302C;}
  .eds-btn.outline{background:#fff;color:#0a0a0a;border-color:#e5e5e5;}
  .eds-btn.outline:hover{background:#fafafa;border-color:#a3a3a3;}
  .eds-btn.ghost{background:transparent;color:#404040;}
  .eds-btn.ghost:hover{background:#f5f5f5;color:#0a0a0a;}
  .eds-btn.destructive{background:#ef4444;color:#fff;}
  .eds-btn.destructive:hover{background:#dc2626;}

  .eds-card{background:#fff;border:1px solid #e5e5e5;border-radius:12px;transition:border-color .12s,box-shadow .12s;}
  .eds-card.hoverable{cursor:pointer;}
  .eds-card.hoverable:hover{border-color:#a3a3a3;box-shadow:var(--shadow-sm);}

  .eds-nav{display:flex;align-items:center;gap:10px;border-radius:6px;text-decoration:none;cursor:pointer;color:#a3a3a3;transition:background .12s,color .12s;}
  .eds-nav.collapsed{width:40px;height:36px;justify-content:center;}
  .eds-nav.expanded{width:100%;padding:7px 9px;justify-content:flex-start;}
  .eds-nav .eds-nav-label{font-size:12px;font-weight:500;color:#525252;white-space:nowrap;}
  .eds-nav:not(.disabled):not(.active):hover{background:#f5f5f5;color:#0a0a0a;}
  .eds-nav:not(.disabled):not(.active):hover .eds-nav-label{color:#0a0a0a;}
  .eds-nav.active{background:#FDECE4;color:#BC2D29;}
  .eds-nav.active .eds-nav-label{color:#BC2D29;}
  .eds-nav.disabled{opacity:.35;cursor:not-allowed;}

  .eds-newscard{display:flex;flex-direction:column;gap:5px;padding:12px;border:1px solid #e5e5e5;border-radius:8px;background:#fff;height:120px;overflow:hidden;cursor:pointer;box-sizing:border-box;transition:border-color .12s,box-shadow .12s;}
  .eds-newscard:hover{border-color:#a3a3a3;box-shadow:var(--shadow-sm);}

  .eds-arow{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid #f5f5f5;min-height:44px;cursor:pointer;transition:background .12s;}
  .eds-arow:hover{background:#fafafa;}

  .eds-trow{background:#fff;border-top:1px solid #f5f5f5;transition:background .12s;}
  .eds-trow:hover{background:#fafafa;}
  .eds-link{font-weight:500;color:#171717;cursor:pointer;text-decoration:none;}
  .eds-trow:hover .eds-link{text-decoration:underline;}

  .eds-iconbtn{padding:6px;border-radius:6px;background:none;border:none;cursor:pointer;color:#a3a3a3;display:flex;transition:background .12s,color .12s;}
  .eds-iconbtn:hover{background:#f5f5f5;color:#0a0a0a;}

  .eds-filterbtn{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;font-size:14px;border-radius:8px;cursor:pointer;font-family:var(--font-sans);border:1px solid #e5e5e5;background:#fff;color:#404040;transition:all .12s;}
  .eds-filterbtn:hover{border-color:#a3a3a3;}
  .eds-filterbtn.on{background:#1E1E1E;color:#FFF9EE;border-color:#1E1E1E;}

  .eds-viewall{font-size:12px;color:#a3a3a3;cursor:pointer;text-decoration:none;transition:color .12s;}
  .eds-viewall:hover{color:#171717;}

  .eds-search-input:focus{border-color:#DE5533;box-shadow:0 0 0 1px #DE5533;}
</style>
</head>
<body>
<div id="root"></div>

<!-- Lucide UMD (the app's icon system) -->

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="Icon.jsx"></script>
<script type="text/babel" src="Primitives.jsx"></script>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="TopBar.jsx"></script>
<script type="text/babel" src="LoginScreen.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="StartupsScreen.jsx"></script>
<script type="text/babel" src="DetailScreen.jsx"></script>
<script type="text/babel" src="App.jsx"></script>
</body>
</html>
