<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0;width:1280px;height:854px;overflow:hidden;}
  .tile{display:flex;width:1280px;height:854px;}
  .main{flex:1;background:#BC2D29;display:flex;align-items:center;justify-content:center;}
  .main img{width:70%;filter:brightness(0) invert(1);}
  .strip{width:320px;height:854px;display:flex;flex-direction:column;}
  .strip div{flex:1;}
</style>
</head>
<body>
<div class="tile">
  <div class="main"><img src="assets/logo.svg" alt="Eatable Adventures"></div>
  <div class="strip">
    <div style="background:#F5EACE"></div>
    <div style="background:#FFA103"></div>
    <div style="background:#DE5533"></div>
    <div style="background:#450E14"></div>
  </div>
</div>
</body>
</html>
