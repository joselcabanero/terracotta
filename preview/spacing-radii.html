<!-- @dsCard group="Spacing" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--font-sans);}
  .wrap{padding:24px 32px;display:flex;gap:24px;align-items:flex-end;}
  .item{display:flex;flex-direction:column;gap:9px;align-items:center;}
  .box{width:86px;height:62px;background:#111;}
  .box.out{background:#fff;border:1px solid #111;}
  .nm{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;}
  .v{font-family:var(--font-mono);font-size:10px;color:var(--fg3);}
  .note{margin-left:auto;max-width:170px;font-size:12px;color:var(--fg3);line-height:1.45;}
</style>
</head>
<body>
<div class="wrap">
  <div class="item"><div class="box"></div><div class="nm">Square</div><div class="v">radius 0</div></div>
  <div class="item"><div class="box out"></div><div class="nm">Keyline</div><div class="v">radius 0</div></div>
  <div class="item"><div class="box" style="border-radius:9999px;width:62px;"></div><div class="nm">Dot</div><div class="v">data only</div></div>
  <p class="note">Rectilinear by rule. Every edge is sharp; the only curve is the dot reserved for data markers.</p>
</div>
</body>
</html>
