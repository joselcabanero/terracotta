<!-- @dsCard group="Spacing" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--fg1);font-family:var(--font-sans);}
  .wrap{padding:24px 32px;display:flex;gap:22px;align-items:flex-end;}
  .item{display:flex;flex-direction:column;gap:9px;align-items:center;}
  .box{width:78px;height:60px;background:var(--red);}
  .nm{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
  .v{font-size:10px;color:var(--fg3);}
  .note{margin-left:auto;max-width:180px;font-size:12px;color:var(--fg3);line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <div class="item"><div class="box" style="border-radius:6px"></div><div class="nm">sm</div><div class="v">6px · chips</div></div>
  <div class="item"><div class="box" style="border-radius:10px"></div><div class="nm">md</div><div class="v">10px · inputs</div></div>
  <div class="item"><div class="box" style="border-radius:16px"></div><div class="nm">lg</div><div class="v">16px · cards</div></div>
  <div class="item"><div class="box" style="border-radius:24px"></div><div class="nm">xl</div><div class="v">24px · panels</div></div>
  <div class="item"><div class="box" style="border-radius:999px;width:60px"></div><div class="nm">pill</div><div class="v">buttons</div></div>
  <p class="note">Rounded by rule — cards, boxes and pills curve. Edges stay sharp only when a block bleeds to the format edge.</p>
</div>
</body>
</html>
