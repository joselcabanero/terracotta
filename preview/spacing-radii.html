<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--fg1);}
  .wrap{padding:24px 28px;display:flex;gap:18px;align-items:flex-end;}
  .item{display:flex;flex-direction:column;gap:8px;align-items:center;}
  .box{width:78px;height:62px;background:var(--surface-fill);border:1px solid var(--border-1);}
  .nm{font-size:11px;font-weight:600;}
  .v{font-family:var(--font-mono);font-size:10px;color:var(--fg3);}
</style>
</head>
<body>
<div class="wrap">
  <div class="item"><div class="box" style="border-radius:4px"></div><div class="nm">sm</div><div class="v">4px</div></div>
  <div class="item"><div class="box" style="border-radius:6px"></div><div class="nm">md</div><div class="v">6px</div></div>
  <div class="item"><div class="box" style="border-radius:8px"></div><div class="nm">lg · base</div><div class="v">8px</div></div>
  <div class="item"><div class="box" style="border-radius:12px"></div><div class="nm">xl · cards</div><div class="v">12px</div></div>
  <div class="item"><div class="box" style="border-radius:9999px"></div><div class="nm">full</div><div class="v">badges</div></div>
</div>
</body>
</html>
