<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,300,0,0">
<style>
  html,body{margin:0;background:#fff;color:var(--fg1);font-family:var(--font-sans);}
  .wrap{padding:24px 32px;background:#fff;max-width:640px;}
  .stage{position:relative;background:rgba(30,30,30,.35);border-radius:var(--radius-md);padding:40px 24px;display:flex;justify-content:center;}
  .dialog{width:440px;max-width:100%;background:#fff;border-radius:var(--radius-lg);box-shadow:0 22px 48px -16px rgba(69,14,20,0.22);box-sizing:border-box;overflow:hidden;}
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px 4px;}
  .title{font-size:18px;font-weight:400;letter-spacing:-0.01em;margin:0;}
  .close{border:none;background:none;color:var(--fg3);cursor:pointer;display:flex;padding:2px;border-radius:var(--radius-pill);}
  .close .material-symbols-outlined{font-size:20px;}
  .body{padding:6px 22px 4px;}
  .body p{margin:0 0 16px;font-size:13px;line-height:1.55;color:var(--fg2);}
  .field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--fg2);margin-bottom:6px;}
  .field input{width:100%;padding:10px 13px;border:1px solid var(--input);border-radius:var(--radius-md);font-size:14px;font-family:var(--font-sans);box-sizing:border-box;color:var(--fg1);}
  .field input::placeholder{color:var(--fg4);}
  .hint{font-size:12px;color:var(--fg3);margin:6px 0 0;}
  .foot{display:flex;justify-content:flex-end;gap:8px;padding:18px 22px 20px;}
  .btn{font-family:var(--font-sans);font-size:13px;font-weight:500;border-radius:var(--radius-pill);padding:9px 18px;cursor:pointer;border:1px solid transparent;}
  .ghost{background:transparent;color:var(--fg2);}
  .primary{background:var(--red);color:#fff;}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <div class="dialog">
      <div class="head">
        <h2 class="title">New pilot</h2>
        <button class="close"><span class="material-symbols-outlined">close</span></button>
      </div>
      <div class="body">
        <p>Connect a startup with a corporate partner to launch a validation pilot.</p>
        <div class="field">
          <label>Pilot name</label>
          <input placeholder="e.g. Precision fermentation — Nestlé">
          <p class="hint">Use the format technology — partner.</p>
        </div>
      </div>
      <div class="foot">
        <button class="btn ghost">Cancel</button>
        <button class="btn primary">Create pilot</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
