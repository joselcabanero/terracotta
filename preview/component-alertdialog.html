<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,300,0,0">
<style>
  html,body{margin:0;background:#fff;color:var(--fg1);font-family:var(--font-sans);}
  .wrap{padding:24px 32px;background:#fff;max-width:640px;}
  .stage{position:relative;background:rgba(30,30,30,.35);border-radius:var(--radius-md);padding:40px 24px;display:flex;justify-content:center;}
  .dialog{width:440px;max-width:100%;background:#fff;border-radius:var(--radius-lg);box-shadow:0 22px 48px -16px rgba(69,14,20,0.22);box-sizing:border-box;padding:22px;}
  .lead{display:flex;gap:14px;align-items:flex-start;}
  .ic{flex:none;width:40px;height:40px;border-radius:var(--radius-pill);background:var(--brand-tint);color:var(--red);display:flex;align-items:center;justify-content:center;}
  .ic .material-symbols-outlined{font-size:22px;}
  .title{font-size:18px;font-weight:400;letter-spacing:-0.01em;margin:2px 0 8px;}
  .body p{margin:0;font-size:13px;line-height:1.55;color:var(--fg2);}
  .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}
  .btn{font-family:var(--font-sans);font-size:13px;font-weight:500;border-radius:var(--radius-pill);padding:9px 18px;cursor:pointer;border:1px solid transparent;}
  .ghost{background:transparent;color:var(--fg2);}
  .danger{background:var(--red);color:#fff;}
  .note{margin:16px 0 0;font-size:11px;color:var(--fg3);border-top:1px solid var(--border-2);padding-top:12px;line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <div class="dialog">
      <div class="lead">
        <div class="ic"><span class="material-symbols-outlined">warning</span></div>
        <div class="body">
          <h2 class="title">Delete pilot?</h2>
          <p>“Precision fermentation — Nestlé” and its milestones will be permanently removed. This cannot be undone.</p>
        </div>
      </div>
      <div class="foot">
        <button class="btn ghost">Cancel</button>
        <button class="btn danger">Delete</button>
      </div>
      <p class="note">Use this pattern for irreversible actions — confirmation must be explicit and blocking, never a dismissible toast.</p>
    </div>
  </div>
</div>
</body>
</html>
