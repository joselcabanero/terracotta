<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,300,0,0">
<style>
  html,body{margin:0;background:#fff;color:var(--fg1);font-family:var(--font-sans);}
  .wrap{padding:24px 32px;background:#fff;max-width:640px;display:flex;flex-direction:column;gap:12px;}
  .callout{display:flex;gap:12px;align-items:flex-start;border-radius:var(--radius-md);padding:14px 16px;}
  .callout .material-symbols-outlined{font-size:20px;flex:none;margin-top:1px;}
  .callout .t{font-size:13px;font-weight:500;color:var(--fg1);}
  .callout .d{font-size:13px;color:var(--fg2);line-height:1.5;margin-top:2px;}
  .link{color:var(--red);font-weight:500;cursor:pointer;}
  /* info */
  .info{background:var(--surface-cream);border:1px solid var(--dark-cream);}
  .info .material-symbols-outlined{color:var(--fg2);}
  /* warning — subtle, yellow only on the icon */
  .warn{background:#fff;border:1px solid var(--border-1);}
  .warn .material-symbols-outlined{color:var(--yellow);}
  /* error */
  .err{background:#F8E5E2;border:1px solid #F0C9C4;border-left:3px solid var(--red);}
  .err .material-symbols-outlined{color:var(--red);}
  .err .t{color:var(--red-strong,#9C231F);}
</style>
</head>
<body>
<div class="wrap">
  <div class="callout info">
    <span class="material-symbols-outlined">info</span>
    <div>
      <div class="t">Pilot window opens 1 July</div>
      <div class="d">Startups can be matched with agritech partners until 15 August. <span class="link">View calendar</span></div>
    </div>
  </div>
  <div class="callout warn">
    <span class="material-symbols-outlined">warning</span>
    <div>
      <div class="t">Two milestones are overdue</div>
      <div class="d">Update progress to keep the partner dashboard accurate.</div>
    </div>
  </div>
  <div class="callout err">
    <span class="material-symbols-outlined">error</span>
    <div>
      <div class="t">Sync with the CRM failed</div>
      <div class="d">Startup records may be out of date. <span class="link">Reconnect</span></div>
    </div>
  </div>
</div>
</body>
</html>
