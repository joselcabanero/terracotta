<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--fg1);font-family:var(--font-sans);}
  .wrap{padding:20px 28px;display:flex;gap:28px;align-items:center;}
  .rail{width:200px;background:#fff;border:1px solid var(--border-1);border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;gap:2px;}
  .glabel{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.7px;color:var(--fg4);padding:4px 8px 2px;}
  .nav{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:6px;font-size:12px;font-weight:500;color:var(--fg3);text-decoration:none;}
  .nav svg{width:16px;height:16px;}
  .nav.active{background:var(--brand-tint);color:var(--brand);}
  .nav.idle:hover{background:var(--surface-fill);color:var(--fg1);}
  .nav.disabled{opacity:.35;}
  .legend{display:flex;flex-direction:column;gap:8px;font-size:11px;color:var(--fg3);font-family:var(--font-mono);}
  .legend b{color:var(--fg1);font-family:var(--font-sans)}
</style>
</head>
<body>
<div class="wrap">
  <div class="rail">
    <span class="glabel">DB</span>
    <a class="nav active"><i data-lucide="building-2"></i>Startups</a>
    <a class="nav idle"><i data-lucide="trending-up"></i>Investors</a>
    <a class="nav idle"><i data-lucide="users"></i>People</a>
    <span class="glabel" style="margin-top:6px">TOOLS</span>
    <a class="nav idle"><i data-lucide="network"></i>Graph</a>
    <a class="nav disabled"><i data-lucide="telescope"></i>Scout</a>
  </div>
  <div class="legend">
    <span><b>active</b> · tint bg + brand fg</span>
    <span><b>idle</b> · neutral-400, hover fill</span>
    <span><b>disabled</b> · 35% opacity</span>
  </div>
</div>
<script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons();</script>
</body>
</html>
