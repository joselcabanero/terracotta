<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--font-sans);}
  .wrap{padding:20px 32px;display:flex;gap:30px;align-items:center;}
  .rail{width:200px;border:1px solid #111;padding:10px 0;display:flex;flex-direction:column;gap:2px;}
  .glabel{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--fg3);padding:6px 14px 3px;}
  .nav{display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:13px;font-weight:500;color:var(--fg2);text-decoration:none;border-left:3px solid transparent;}
  .nav svg{width:16px;height:16px;}
  .nav.active{border-left-color:var(--red);color:var(--ink);font-weight:700;background:#F4F4F2;}
  .nav.idle:hover{background:#EAEAEA;color:var(--ink);}
  .nav.disabled{opacity:.35;}
  .legend{width:160px;flex-shrink:0;display:flex;flex-direction:column;gap:9px;font-family:var(--font-mono);font-size:10px;color:var(--fg3);}
  .legend b{color:var(--ink);font-family:var(--font-sans);font-weight:700;}
</style>
</head>
<body>
<div class="wrap">
  <div class="rail">
    <span class="glabel">DB</span>
    <a class="nav active"><i data-lucide="building-2"></i>Startups</a>
    <a class="nav idle"><i data-lucide="trending-up"></i>Investors</a>
    <a class="nav idle"><i data-lucide="users"></i>People</a>
    <span class="glabel" style="margin-top:6px">Tools</span>
    <a class="nav idle"><i data-lucide="network"></i>Graph</a>
    <a class="nav disabled"><i data-lucide="telescope"></i>Scout</a>
  </div>
  <div class="legend">
    <span><b>active</b><br>red marker bar + ink label</span>
    <span><b>idle</b><br>grey-700, hover fill</span>
    <span><b>disabled</b><br>35% opacity</span>
  </div>
</div>
<script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons();</script>
</body>
</html>
