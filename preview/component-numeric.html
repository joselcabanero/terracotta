<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,300,0,0">
<style>
  html,body{margin:0;background:#fff;color:var(--fg1);font-family:var(--font-sans);}
  .wrap{padding:24px 32px;display:flex;flex-direction:column;gap:20px;max-width:560px;}
  .field{display:flex;flex-direction:column;}
  label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--fg2);margin-bottom:6px;}

  .stepper{display:inline-flex;align-items:center;border:1px solid var(--input);border-radius:var(--radius-md);background:#fff;width:160px;overflow:hidden;}
  .stepper.focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(188,45,41,.15);}
  .stepper.disabled{opacity:.4;cursor:not-allowed;}
  .stepper .step{width:38px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--fg2);}
  .stepper .step:hover{background:var(--surface-cream);}
  .stepper .step .material-symbols-outlined{font-size:20px;}
  .stepper .val{flex:1;text-align:center;font-size:14px;color:var(--fg1);font-variant-numeric:tabular-nums;}

  .unit{display:flex;align-items:center;border:1px solid var(--input);border-radius:var(--radius-md);background:#fff;width:200px;overflow:hidden;}
  .unit.focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(188,45,41,.15);}
  .unit .pre,.unit .suf{padding:0 11px;font-size:14px;color:var(--fg3);}
  .unit .num{flex:1;padding:10px 0;font-size:14px;color:var(--fg1);font-variant-numeric:tabular-nums;}
  .row{display:flex;gap:18px;flex-wrap:wrap;}
  .cap{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--fg3);margin-bottom:6px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="field">
    <label>Startups per cohort</label>
    <div class="row">
      <div>
        <div class="cap">default</div>
        <div class="stepper"><span class="step"><span class="material-symbols-outlined">remove</span></span><span class="val">8</span><span class="step"><span class="material-symbols-outlined">add</span></span></div>
      </div>
      <div>
        <div class="cap">focus</div>
        <div class="stepper focus"><span class="step"><span class="material-symbols-outlined">remove</span></span><span class="val">12</span><span class="step"><span class="material-symbols-outlined">add</span></span></div>
      </div>
      <div>
        <div class="cap">disabled</div>
        <div class="stepper disabled"><span class="step"><span class="material-symbols-outlined">remove</span></span><span class="val">8</span><span class="step"><span class="material-symbols-outlined">add</span></span></div>
      </div>
    </div>
  </div>

  <div class="field">
    <label>Budget ceiling</label>
    <div class="unit focus"><span class="pre">€</span><span class="num">45,000</span></div>
  </div>

  <div class="field">
    <label>Pilot duration</label>
    <div class="unit"><span class="num">&nbsp;&nbsp;6</span><span class="suf">months</span></div>
  </div>
</div>
</body>
</html>
