<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--fg1);font-family:var(--font-sans);}
  .wrap{padding:26px 32px;}
  .cap{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.12em;color:var(--fg3);margin-bottom:14px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .cell{border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-1);}
  .sw{height:84px;}
  .info{padding:9px 10px;}
  .nm{font-size:12px;font-weight:700;}
  .hx{font-size:10px;color:var(--fg3);margin-top:2px;letter-spacing:.02em;}
  .role{font-size:10px;color:var(--fg4);margin-top:4px;line-height:1.3;}
</style>
</head>
<body>
<div class="wrap">
  <div class="cap">Primary colors — two mother colors (Red + Cream) carry the system</div>
  <div class="grid">
    <div class="cell"><div class="sw" style="background:#BC2D29"></div><div class="info"><div class="nm">EAV Red</div><div class="hx">#BC2D29</div><div class="role">Representative color</div></div></div>
    <div class="cell"><div class="sw" style="background:#FFF9EE"></div><div class="info"><div class="nm">EAV Cream</div><div class="hx">#FFF9EE</div><div class="role">Editorial blocks</div></div></div>
    <div class="cell"><div class="sw" style="background:#FFFFFF;border-bottom:1px solid var(--border-1)"></div><div class="info"><div class="nm">White</div><div class="hx">#FFFFFF</div><div class="role">Predominant ground</div></div></div>
    <div class="cell"><div class="sw" style="background:#1E1E1E"></div><div class="info"><div class="nm">EAV Black</div><div class="hx">#1E1E1E</div><div class="role">Footers & type</div></div></div>
  </div>
</div>
</body>
</html>
