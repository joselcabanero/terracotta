<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--font-sans);}
  .wrap{padding:28px 32px;}
  .triad{display:flex;border:1px solid var(--ink);}
  .cell{flex:1;height:92px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box;}
  .cell .nm{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;}
  .cell .hx{font-family:var(--font-mono);font-size:10px;margin-top:2px;}
  .rule{height:2px;background:var(--ink);margin-top:0;}
</style>
</head>
<body>
<div class="wrap">
  <div class="triad">
    <div class="cell" style="background:#fff;color:#111;border-right:1px solid #111;"><span class="nm">Paper</span><span class="hx">#FFFFFF</span></div>
    <div class="cell" style="background:#111;color:#fff;"><span class="nm">Ink</span><span class="hx">#111111</span></div>
    <div class="cell" style="background:#E1251B;color:#fff;"><span class="nm">Red</span><span class="hx">#E1251B</span></div>
  </div>
</div>
</body>
</html>
