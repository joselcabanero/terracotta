<!-- @dsCard group="Brand" viewport="700x340" name="Swiss layout specimen" subtitle="Asymmetric 12-col composition, one red field" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--font-sans);}
  .poster{padding:28px 32px;display:grid;grid-template-columns:repeat(12,1fr);gap:16px;align-content:start;}
  .top{grid-column:1 / 13;display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:8px;}
  .top .k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;}
  .top .k.red{color:var(--red);}
  .head{grid-column:1 / 9;margin-top:8px;}
  .head h1{font-size:48px;line-height:0.98;font-weight:700;letter-spacing:-0.03em;margin:0;}
  .mark{grid-column:11 / 13;margin-top:8px;align-self:start;}
  .mark .sq{width:100%;aspect-ratio:1;background:var(--red);}
  .meta{grid-column:1 / 5;margin-top:6px;}
  .meta p{margin:0;font-size:13px;line-height:1.45;color:var(--fg2);}
  .stat{grid-column:6 / 9;margin-top:6px;}
  .stat .big{font-size:39px;font-weight:700;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;}
  .stat .cap{font-family:var(--font-mono);font-size:10px;color:var(--fg3);text-transform:uppercase;letter-spacing:.08em;}
  .foot{grid-column:1 / 13;margin-top:8px;border-top:1px solid #DBDBDB;padding-top:6px;display:flex;gap:18px;font-family:var(--font-mono);font-size:10px;color:var(--fg3);}
</style>
</head>
<body>
<div class="poster">
  <div class="top"><span class="k">Eatable Adventures</span><span class="k red">Ecosystem DB · 2026</span></div>
  <div class="head"><h1>Agrifood-<br>tech, on<br>the grid.</h1></div>
  <div class="mark"><div class="sq"></div></div>
  <div class="meta"><p>An objective record of startups, investors and the edges between them — organised by taxonomy, not opinion.</p></div>
  <div class="stat"><div class="big">312</div><div class="cap">startups indexed</div></div>
  <div class="foot"><span>01 — Startups</span><span>02 — Investors</span><span>03 — Graph</span></div>
</div>
</body>
</html>
