<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,300,0,0">
<style>
  html,body{margin:0;background:#fff;color:var(--fg1);font-family:var(--font-sans);}
  .wrap{padding:24px 32px;background:#fff;max-width:640px;display:flex;flex-direction:column;gap:24px;}
  .block{display:flex;flex-direction:column;gap:12px;}
  .cap{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--fg3);}
  /* spinner */
  .spin-row{display:flex;align-items:center;gap:12px;}
  .spinner{width:24px;height:24px;border-radius:50%;border:3px solid var(--surface-sand);border-top-color:var(--red);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .spin-row .lbl{font-size:13px;color:var(--fg2);}
  /* progress bar */
  .pbar-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--fg3);}
  .pbar{height:8px;border-radius:var(--radius-pill);background:var(--surface-cream);overflow:hidden;}
  .pbar i{display:block;height:100%;width:65%;background:var(--red);border-radius:var(--radius-pill);}
  /* skeleton */
  .skel-card{border:1px solid var(--border-1);border-radius:var(--radius-md);padding:14px;display:flex;gap:12px;align-items:center;}
  .sk{background:linear-gradient(90deg,#EFEBE3 25%,#F7F3EC 50%,#EFEBE3 75%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;border-radius:6px;}
  @keyframes shimmer{to{background-position:-200% 0;}}
  .sk.avatar{width:40px;height:40px;border-radius:var(--radius-pill);flex:none;}
  .sk-lines{flex:1;display:flex;flex-direction:column;gap:8px;}
  .sk.line{height:11px;}
  .sk.l1{width:55%;} .sk.l2{width:80%;}
</style>
</head>
<body>
<div class="wrap">
  <div class="block">
    <div class="cap">Spinner</div>
    <div class="spin-row">
      <div class="spinner"></div>
      <span class="lbl">Loading…</span>
    </div>
  </div>
  <div class="block">
    <div class="cap">Progress — determinate</div>
    <div class="pbar-meta"><span>Importing startups</span><span>65%</span></div>
    <div class="pbar"><i></i></div>
  </div>
  <div class="block">
    <div class="cap">Skeleton — list row</div>
    <div class="skel-card">
      <div class="sk avatar"></div>
      <div class="sk-lines">
        <div class="sk line l1"></div>
        <div class="sk line l2"></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
