<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--font-sans);}
  .wrap{padding:28px 32px;}
  .scale{display:flex;border:1px solid var(--ink);}
  .sw{flex:1;height:70px;border-right:1px solid #DBDBDB;}
  .sw:last-child{border-right:0;}
  .labels{display:flex;margin-top:8px;}
  .lb{flex:1;font-family:var(--font-mono);font-size:9px;color:var(--fg3);text-align:center;line-height:1.5;}
  .lb b{display:block;color:var(--ink);font-weight:700;font-size:9.5px;font-family:var(--font-sans);}
</style>
</head>
<body>
<div class="wrap">
  <div class="scale">
    <div class="sw" style="background:#FFFFFF"></div>
    <div class="sw" style="background:#F4F4F2"></div>
    <div class="sw" style="background:#EAEAEA"></div>
    <div class="sw" style="background:#DBDBDB"></div>
    <div class="sw" style="background:#C2C2C2"></div>
    <div class="sw" style="background:#9B9B9B"></div>
    <div class="sw" style="background:#6F6F6F"></div>
    <div class="sw" style="background:#4A4A4A"></div>
    <div class="sw" style="background:#222222"></div>
    <div class="sw" style="background:#111111"></div>
  </div>
  <div class="labels">
    <div class="lb"><b>0</b>fff</div>
    <div class="lb"><b>50</b>f4f4f2</div>
    <div class="lb"><b>100</b>eaeaea</div>
    <div class="lb"><b>200</b>dbdbdb</div>
    <div class="lb"><b>300</b>c2c2c2</div>
    <div class="lb"><b>400</b>9b9b9b</div>
    <div class="lb"><b>500</b>6f6f6f</div>
    <div class="lb"><b>600</b>4a4a4a</div>
    <div class="lb"><b>800</b>222</div>
    <div class="lb"><b>900</b>111</div>
  </div>
</div>
</body>
</html>
