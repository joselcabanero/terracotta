<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--fg1);font-family:var(--font-sans);}
  .wrap{padding:26px 32px;display:flex;flex-direction:column;gap:18px;}
  .cap{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.12em;color:var(--fg3);margin-bottom:10px;}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;}
  .cell{border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-1);}
  .sw{height:54px;}
  .info{padding:7px 8px;}
  .nm{font-size:11px;font-weight:700;line-height:1.15;}
  .hx{font-size:9.5px;color:var(--fg3);margin-top:2px;}
  .ramp{display:flex;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-1);}
  .rs{flex:1;height:40px;}
  .rlabels{display:flex;margin-top:6px;}
  .rl{flex:1;font-size:9px;color:var(--fg3);text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="cap">Secondary colors — restricted roles</div>
    <div class="grid">
      <div class="cell"><div class="sw" style="background:#F5EACE"></div><div class="info"><div class="nm">Dark Cream</div><div class="hx">#F5EACE</div></div></div>
      <div class="cell"><div class="sw" style="background:#FAFAFA;border-bottom:1px solid var(--border-1)"></div><div class="info"><div class="nm">Light Grey</div><div class="hx">#FAFAFA</div></div></div>
      <div class="cell"><div class="sw" style="background:#E8E8E8"></div><div class="info"><div class="nm">Grey</div><div class="hx">#E8E8E8</div></div></div>
      <div class="cell"><div class="sw" style="background:#FFA103"></div><div class="info"><div class="nm">Yellow</div><div class="hx">light point</div></div></div>
      <div class="cell"><div class="sw" style="background:#DE5533"></div><div class="info"><div class="nm">Orange</div><div class="hx">gradient only</div></div></div>
      <div class="cell"><div class="sw" style="background:#450E14"></div><div class="info"><div class="nm">Burgundy</div><div class="hx">#450E14</div></div></div>
    </div>
  </div>
  <div>
    <div class="cap">Warm-neutral text ramp (derived)</div>
    <div class="ramp">
      <div class="rs" style="background:#1E1E1E"></div>
      <div class="rs" style="background:#574E48"></div>
      <div class="rs" style="background:#857B72"></div>
      <div class="rs" style="background:#ABA197"></div>
      <div class="rs" style="background:#DCD6CC"></div>
      <div class="rs" style="background:#F3EFE7"></div>
    </div>
    <div class="rlabels">
      <div class="rl">fg1 · text</div>
      <div class="rl">fg2 · secondary</div>
      <div class="rl">fg3 · muted</div>
      <div class="rl">fg4 · faint</div>
      <div class="rl">border</div>
      <div class="rl">fill</div>
    </div>
  </div>
</div>
</body>
</html>
