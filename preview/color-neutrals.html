<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--fg1);}
  .wrap{padding:24px 28px;}
  .scale{display:flex;gap:0;border:1px solid var(--border-1);border-radius:10px;overflow:hidden;}
  .sw{flex:1;height:74px;}
  .labels{display:flex;gap:0;margin-top:8px;}
  .lb{flex:1;font-family:var(--font-mono);font-size:9px;color:var(--fg3);text-align:center;line-height:1.4;}
  .lb b{display:block;color:var(--fg1);font-weight:500;font-size:9.5px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="scale">
    <div class="sw" style="background:#ffffff;border-right:1px solid var(--border-1)"></div>
    <div class="sw" style="background:#FFFBF4"></div>
    <div class="sw" style="background:#FBF3E2"></div>
    <div class="sw" style="background:#F5EACE"></div>
    <div class="sw" style="background:#EBE2D2"></div>
    <div class="sw" style="background:#ABA097"></div>
    <div class="sw" style="background:#7C726C"></div>
    <div class="sw" style="background:#4A433F"></div>
    <div class="sw" style="background:#1E1E1E"></div>
  </div>
  <div class="labels">
    <div class="lb"><b>paper</b>#fff</div>
    <div class="lb"><b>50</b>#FFFBF4</div>
    <div class="lb"><b>100</b>#FBF3E2</div>
    <div class="lb"><b>sand</b>#F5EACE</div>
    <div class="lb"><b>200</b>#EBE2D2</div>
    <div class="lb"><b>400</b>#ABA097</div>
    <div class="lb"><b>500</b>#7C726C</div>
    <div class="lb"><b>700</b>#4A433F</div>
    <div class="lb"><b>ink</b>#1E1E1E</div>
  </div>
</div>
</body>
</html>
