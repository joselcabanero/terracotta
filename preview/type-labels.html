<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--fg1);}
  .wrap{padding:24px 28px;display:flex;flex-direction:column;gap:20px;}
  .grp{display:flex;flex-direction:column;gap:7px;}
  .note{font-size:11px;color:var(--fg4);font-family:var(--font-mono);}
  .label-mono{font-family:var(--font-mono);font-size:9px;font-weight:400;text-transform:uppercase;letter-spacing:.7px;color:var(--fg4);}
  .eyebrow{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg3);}
  .col-head{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--fg3);}
</style>
</head>
<body>
<div class="wrap">
  <div class="grp">
    <span class="label-mono">MAIN&nbsp;&nbsp;·&nbsp;&nbsp;DB&nbsp;&nbsp;·&nbsp;&nbsp;TOOLS</span>
    <span class="note">.label-mono — IBM Plex Mono 9px, sidebar group labels</span>
  </div>
  <div class="grp">
    <span class="eyebrow">Agrifoodtech News</span>
    <span class="note">.eyebrow — Inter 12px 600, Home section divider</span>
  </div>
  <div class="grp">
    <span class="col-head">Company&nbsp;&nbsp;&nbsp;Sector&nbsp;&nbsp;&nbsp;Stage&nbsp;&nbsp;&nbsp;Founded</span>
    <span class="note">table column header — Inter 12px 600 uppercase tracked</span>
  </div>
</div>
</body>
</html>
