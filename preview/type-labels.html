<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--font-sans);}
  .wrap{padding:26px 32px;display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  .col{display:flex;flex-direction:column;gap:10px;}
  .grp{display:flex;flex-direction:column;gap:6px;}
  .note{font-size:10px;color:var(--fg4);font-family:var(--font-mono);}
  .label{font-family:var(--font-sans);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--ink);}
  .eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--ink);}
  .colhead{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink);border-bottom:2px solid var(--ink);padding-bottom:5px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="col">
    <div class="grp"><span class="label">Main / DB / Tools</span><span class="note">.label — grotesk 11px 700, tracked .12em</span></div>
    <div class="grp"><span class="eyebrow">Agrifoodtech News</span><span class="note">.eyebrow — 12px 700, tracked .14em</span></div>
  </div>
  <div class="col">
    <div class="grp"><span class="colhead">Company&nbsp;&nbsp;Sector&nbsp;&nbsp;Stage</span><span class="note">column header — 11px 700, ink keyline</span></div>
    <div class="grp"><a class="link" style="font-size:15px;align-self:flex-start;">View all startups</a><span class="note">link — ink + red underline marker</span></div>
  </div>
</div>
</body>
</html>
