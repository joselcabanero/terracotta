<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,300,0,0">
<style>
  html,body{margin:0;background:#fff;color:var(--fg1);font-family:var(--font-sans);}
  .wrap{padding:24px 32px;background:#fff;max-width:640px;}
  .cap{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--fg3);margin-bottom:14px;}
  .stack{display:flex;flex-direction:column;gap:10px;align-items:flex-end;}
  .toast{position:relative;width:340px;background:#fff;border:1px solid var(--border-1);border-radius:12px;box-shadow:0 10px 28px -12px rgba(30,30,30,0.18);padding:13px 14px;display:flex;gap:11px;align-items:flex-start;overflow:hidden;}
  .toast.err{border-left:3px solid var(--red);}
  .ic{flex:none;width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:var(--red);margin-top:1px;}
  .ic .material-symbols-outlined{font-size:20px;}
  .txt{flex:1;}
  .txt .ti{font-size:13px;font-weight:500;color:var(--fg1);}
  .txt .ds{font-size:12px;color:var(--fg3);margin-top:2px;line-height:1.4;}
  .link{color:var(--red);font-weight:500;cursor:pointer;}
  .close{border:none;background:none;color:var(--fg4);cursor:pointer;display:flex;padding:0;}
  .close .material-symbols-outlined{font-size:18px;}
  .progress{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--surface-sand);}
  .progress i{display:block;height:100%;width:62%;background:var(--red);}
</style>
</head>
<body>
<div class="wrap">
  <div class="cap">Toasts — bottom-right, auto-dismiss</div>
  <div class="stack">
    <div class="toast">
      <div class="ic"><span class="material-symbols-outlined">check_circle</span></div>
      <div class="txt">
        <div class="ti">Pilot saved</div>
        <div class="ds">Changes are live for the team.</div>
      </div>
      <button class="close"><span class="material-symbols-outlined">close</span></button>
      <div class="progress"><i></i></div>
    </div>
    <div class="toast err">
      <div class="ic"><span class="material-symbols-outlined">error</span></div>
      <div class="txt">
        <div class="ti">Couldn't save</div>
        <div class="ds">Network error. <span class="link">Retry</span></div>
      </div>
      <button class="close"><span class="material-symbols-outlined">close</span></button>
    </div>
  </div>
</div>
</body>
</html>
