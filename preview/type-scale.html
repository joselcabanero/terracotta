<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--fg1);}
  .wrap{padding:22px 28px;display:flex;flex-direction:column;gap:14px;}
  .line{display:flex;align-items:baseline;gap:16px;border-bottom:1px solid var(--border-2);padding-bottom:12px;}
  .line:last-child{border-bottom:0;padding-bottom:0;}
  .spec{font-family:var(--font-mono);font-size:10px;color:var(--fg4);width:120px;flex-shrink:0;line-height:1.4;}
</style>
</head>
<body>
<div class="wrap">
  <div class="line"><div class="spec">24 / 500 / -2%</div><div style="font-size:24px;font-weight:500;letter-spacing:-0.02em;">Startups</div></div>
  <div class="line"><div class="spec">20 / 600 / -1%</div><div style="font-size:20px;font-weight:600;letter-spacing:-0.01em;">Recent Activity</div></div>
  <div class="line"><div class="spec">14 / 600</div><div style="font-size:14px;font-weight:600;">Latest Startups</div></div>
  <div class="line"><div class="spec">14 / 400</div><div style="font-size:14px;">Browse and filter all startups in the ecosystem database.</div></div>
  <div class="line"><div class="spec">12 / 400 / fg3</div><div style="font-size:12px;color:var(--fg3);">312 total · 1–25 of 312</div></div>
</div>
</body>
</html>
