<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--fg1);font-family:var(--font-sans);}
  .wrap{padding:24px 32px;}
  .head{font-size:10px;color:var(--fg3);text-transform:uppercase;letter-spacing:.12em;font-weight:500;margin-bottom:14px;}
  .row{display:flex;align-items:baseline;gap:18px;border-top:1px solid var(--border-1);padding:9px 0;}
  .spec{font-size:11px;color:var(--fg4);width:108px;flex-shrink:0;}
  .spec b{color:var(--fg1);font-weight:700;}
  .samp{letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">Type scale · Rubik · base 16</div>
  <div class="row"><div class="spec"><b>60</b> / t-4xl</div><div class="samp" style="font-size:46px;font-weight:400;">Food innovation</div></div>
  <div class="row"><div class="spec"><b>36</b> / t-2xl · h1</div><div class="samp" style="font-size:36px;font-weight:400;">The beating <b style="font-weight:700">heart</b></div></div>
  <div class="row"><div class="spec"><b>22</b> / t-lg · h3</div><div class="samp" style="font-size:22px;font-weight:500;">Active hubs in four territories</div></div>
  <div class="row"><div class="spec"><b>16</b> / t-base</div><div class="samp" style="font-size:16px;font-weight:400;">We work from challenge to validated pilot.</div></div>
  <div class="row"><div class="spec"><b>13</b> / t-xs</div><div class="samp" style="font-size:13px;font-weight:400;color:var(--fg3);">70 companies · 6 to 12 months</div></div>
</div>
</body>
</html>
