<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--font-sans);}
  .wrap{padding:24px 32px;}
  .head{font-family:var(--font-mono);font-size:10px;color:var(--fg3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:14px;}
  .row{display:flex;align-items:baseline;gap:18px;border-top:1px solid #DBDBDB;padding:9px 0;}
  .spec{font-family:var(--font-mono);font-size:10px;color:var(--fg4);width:96px;flex-shrink:0;}
  .spec b{color:var(--ink);}
  .samp{font-weight:500;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">Modular scale · ratio 1.25 · base 16</div>
  <div class="row"><div class="spec"><b>61</b> / t-4xl</div><div class="samp" style="font-size:46px;font-weight:700;">Ecosystem</div></div>
  <div class="row"><div class="spec"><b>39</b> / t-2xl · h1</div><div class="samp" style="font-size:39px;font-weight:700;">Startup Intelligence</div></div>
  <div class="row"><div class="spec"><b>25</b> / t-lg · h3</div><div class="samp" style="font-size:25px;">Funding rounds</div></div>
  <div class="row"><div class="spec"><b>16</b> / t-base</div><div class="samp" style="font-size:16px;font-weight:400;">Browse and filter all startups in the database.</div></div>
  <div class="row"><div class="spec"><b>13</b> / t-xs</div><div class="samp" style="font-size:13px;font-weight:400;color:#6F6F6F;">312 total · 1–25 of 312</div></div>
</div>
</body>
</html>
