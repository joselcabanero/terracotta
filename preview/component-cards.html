<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--font-sans);}
  .wrap{padding:22px 32px;display:flex;gap:16px;}
  .news{width:220px;border:1px solid #111;padding:12px;display:flex;flex-direction:column;gap:6px;}
  .news .top{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10px;color:var(--fg3);}
  .news .ttl{font-size:14px;font-weight:700;line-height:1.25;letter-spacing:-0.01em;}
  .news .sum{font-size:12px;color:var(--fg3);line-height:1.4;}
  .news .tag{align-self:flex-start;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#fff;background:#E1251B;padding:2px 7px;margin-top:2px;}
  .col{flex:1;border:1px solid #111;}
  .col .hd{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:2px solid #111;}
  .col .hd h3{margin:0;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;}
  .col .hd a{font-family:var(--font-mono);font-size:11px;color:var(--ink);text-decoration:none;}
  .item{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid #DBDBDB;}
  .item:last-child{border-bottom:0;}
  .item .nm{font-size:13px;font-weight:500;}
  .item .meta{display:flex;gap:6px;align-items:center;margin-top:3px;}
  .sq{width:9px;height:9px;display:inline-block;}
  .item .t{font-family:var(--font-mono);font-size:10px;color:var(--fg3);}
</style>
</head>
<body>
<div class="wrap">
  <div class="news">
    <div class="top"><span>AGFUNDER</span><span>2d</span></div>
    <div class="ttl">Vertical-farming startup raises €12M Series A</div>
    <div class="sum">Round led by a European impact fund to scale leafy-green production.</div>
    <span class="tag">Funding</span>
  </div>
  <div class="col">
    <div class="hd"><h3>Latest Startups</h3><a>View all →</a></div>
    <div class="item">
      <div><div class="nm">Mycorena</div><div class="meta"><span class="sq" style="background:#639922"></span><span class="t">Innovative Food · Sweden</span></div></div>
      <span class="t">3h</span>
    </div>
    <div class="item">
      <div><div class="nm">Infarm</div><div class="meta"><span class="sq" style="background:#1D9E75"></span><span class="t">Agritech · Germany</span></div></div>
      <span class="t">1d</span>
    </div>
  </div>
</div>
</body>
</html>
