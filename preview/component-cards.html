<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,300,0,0">
<style>
  html,body{margin:0;background:var(--surface-grey);color:var(--fg1);font-family:var(--font-sans);}
  .wrap{padding:22px 28px;display:flex;gap:16px;align-items:stretch;}
  .material-symbols-outlined{font-size:22px;line-height:1;}
  .card{background:#fff;border:1px solid var(--border-1);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow-sm);}
  .feature{width:230px;display:flex;flex-direction:column;gap:10px;}
  .ic{width:40px;height:40px;border-radius:999px;background:var(--brand-tint);color:var(--red);display:flex;align-items:center;justify-content:center;}
  .feature h3{margin:0;font-size:17px;font-weight:500;letter-spacing:-0.01em;}
  .feature p{margin:0;font-size:13px;line-height:1.5;color:var(--fg3);}
  .cream{flex:1;background:var(--surface-cream);border:1px solid var(--border-2);border-radius:var(--radius-lg);padding:18px;display:flex;flex-direction:column;gap:8px;}
  .eyebrow{font-size:11px;font-weight:400;text-transform:uppercase;letter-spacing:.16em;color:var(--red);}
  .cream .big{font-size:17px;font-weight:400;line-height:1.3;letter-spacing:-0.01em;}
  .cream .big b{font-weight:700;}
  .metric{width:150px;display:flex;flex-direction:column;justify-content:center;gap:4px;}
  .metric .n{font-size:40px;font-weight:500;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;}
  .metric .l{font-size:12px;color:var(--fg3);}
</style>
</head>
<body>
<div class="wrap">
  <div class="card feature">
    <div class="ic"><span class="material-symbols-outlined">cardiology</span></div>
    <h3>Detect the obstacle</h3>
    <p>Find what blocks adoption and where the decision chain breaks.</p>
  </div>
  <div class="cream">
    <span class="eyebrow">Highlighted block</span>
    <div class="big">When a startup joins, it already knows <b>which company it will pilot with.</b></div>
  </div>
  <div class="card metric">
    <div class="n tnum">70+</div>
    <div class="l">companies with real projects</div>
  </div>
</div>
</body>
</html>
