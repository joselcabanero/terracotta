<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--font-sans);}
  .wrap{padding:26px 32px;display:flex;align-items:center;gap:30px;}
  .logo{width:120px;height:120px;}
  .logo img{width:100%;height:100%;object-fit:contain;}
  .meta{display:flex;flex-direction:column;gap:6px;border-left:2px solid var(--ink);padding-left:20px;}
  .meta .nm{font-size:15px;font-weight:700;}
  .meta .sub{font-size:13px;color:var(--fg3);}
  .meta .note{font-family:var(--font-mono);font-size:10px;color:var(--fg4);margin-top:4px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><img src="../assets/logo.svg" alt="Eatable Adventures"></div>
  <div class="meta">
    <span class="nm">Eatable Adventures</span>
    <span class="sub">Startup Intelligence · Ecosystem DB</span>
    <span class="note">assets/logo.svg — single-color wordmark</span>
  </div>
</div>
</body>
</html>
