<!-- @dsCard group="Spacing" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--fg1);font-family:var(--font-sans);}
  .wrap{padding:22px 32px;}
  .hd{font-size:10px;color:var(--fg3);text-transform:uppercase;letter-spacing:.12em;font-weight:500;border-bottom:1px solid var(--border-1);padding-bottom:8px;margin-bottom:14px;}
  .row{display:flex;align-items:center;gap:14px;margin-bottom:10px;}
  .bar{height:16px;border-radius:4px;background:var(--red);}
  .bar.half{background:var(--dark-cream);}
  .nm{font-size:11px;color:var(--fg3);width:140px;}
  .nm b{color:var(--fg1);font-weight:700;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">8px baseline scale (4 = half-step)</div>
  <div class="row"><div class="nm"><b>½</b> · 4px</div><div class="bar half" style="width:4px"></div></div>
  <div class="row"><div class="nm"><b>b1</b> · 8px</div><div class="bar" style="width:8px"></div></div>
  <div class="row"><div class="nm"><b>b2</b> · 16px</div><div class="bar" style="width:16px"></div></div>
  <div class="row"><div class="nm"><b>b3</b> · 24px gutter</div><div class="bar" style="width:24px"></div></div>
  <div class="row"><div class="nm"><b>b4</b> · 32px margin</div><div class="bar" style="width:32px"></div></div>
  <div class="row"><div class="nm"><b>b6</b> · 48px section</div><div class="bar" style="width:48px"></div></div>
  <div class="row"><div class="nm"><b>b8</b> · 64px</div><div class="bar" style="width:64px"></div></div>
</div>
</body>
</html>
