<!-- @dsCard group="Spacing" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--fg1);}
  .wrap{padding:24px 28px;display:flex;flex-direction:column;gap:11px;}
  .row{display:flex;align-items:center;gap:14px;}
  .bar{height:14px;background:var(--brand);border-radius:3px;}
  .nm{font-family:var(--font-mono);font-size:10px;color:var(--fg3);width:120px;}
  .nm b{color:var(--fg1)}
</style>
</head>
<body>
<div class="wrap">
  <div class="row"><div class="nm"><b>1</b> · 4px</div><div class="bar" style="width:4px"></div></div>
  <div class="row"><div class="nm"><b>2</b> · 8px</div><div class="bar" style="width:8px"></div></div>
  <div class="row"><div class="nm"><b>3</b> · 12px gap</div><div class="bar" style="width:12px"></div></div>
  <div class="row"><div class="nm"><b>4</b> · 16px card</div><div class="bar" style="width:16px"></div></div>
  <div class="row"><div class="nm"><b>6</b> · 24px page</div><div class="bar" style="width:24px"></div></div>
  <div class="row"><div class="nm"><b>8</b> · 32px</div><div class="bar" style="width:32px"></div></div>
  <div class="row"><div class="nm"><b>12</b> · 48px</div><div class="bar" style="width:48px"></div></div>
</div>
</body>
</html>
