<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--font-sans);}
  .wrap{padding:26px 32px;max-width:560px;}
  .eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--red);margin-bottom:10px;}
  h1{font-size:39px;font-weight:700;letter-spacing:-0.025em;line-height:1.04;margin:0;}
  .lead{font-size:20px;line-height:1.4;color:var(--fg2);margin:14px 0 0;max-width:46ch;}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--fg3);margin-top:16px;border-top:1px solid #DBDBDB;padding-top:8px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Objective hierarchy</div>
  <h1>Order from size, weight, and position — not ornament.</h1>
  <p class="lead">One grotesk, flush-left, ragged-right. The reader's eye is led by scale and the grid alone.</p>
  <div class="meta">eyebrow 12 → headline 39 → lead 20 → meta 11</div>
</div>
</body>
</html>
