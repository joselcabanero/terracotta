<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--font-sans);}
  .wrap{padding:22px 32px;}
  .hd{font-family:var(--font-mono);font-size:10px;color:var(--fg3);text-transform:uppercase;letter-spacing:.1em;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:12px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;}
  .row{display:flex;align-items:center;gap:10px;padding:4px 0;}
  .sq{width:14px;height:14px;flex-shrink:0;}
  .nm{font-size:13px;font-weight:500;}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--fg3);margin-left:auto;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">Sector taxonomy — data-encoding exception (small fields only)</div>
  <div class="grid">
    <div class="row"><span class="sq" style="background:#1D9E75"></span><span class="nm">Agritech</span><span class="hex">1D9E75</span></div>
    <div class="row"><span class="sq" style="background:#639922"></span><span class="nm">Innovative Food</span><span class="hex">639922</span></div>
    <div class="row"><span class="sq" style="background:#EF9F27"></span><span class="nm">Food Logistics</span><span class="hex">EF9F27</span></div>
    <div class="row"><span class="sq" style="background:#D85A30"></span><span class="nm">Retail &amp; Restaurant</span><span class="hex">D85A30</span></div>
    <div class="row"><span class="sq" style="background:#97C459"></span><span class="nm">Kitchen &amp; Cooking</span><span class="hex">97C459</span></div>
    <div class="row"><span class="sq" style="background:#7F77DD"></span><span class="nm">Food as Medicine</span><span class="hex">7F77DD</span></div>
  </div>
</div>
</body>
</html>
