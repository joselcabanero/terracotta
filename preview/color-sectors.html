<!-- @dsCard group="Colors" name="Gradients & light point" subtitle="Hero brand gradient · cream pause · the yellow pulse" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--fg1);font-family:var(--font-sans);}
  .wrap{padding:24px 32px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .cell{display:flex;flex-direction:column;gap:8px;}
  .sw{height:104px;border-radius:var(--radius-md);border:1px solid var(--border-1);position:relative;overflow:hidden;}
  .g-brand{background:var(--gradient-brand);border:0;}
  .g-cream{background:var(--gradient-cream);}
  .g-lp{background:#FFF9EE;}
  .g-lp::after{content:"";position:absolute;left:22%;top:48%;width:120px;height:120px;transform:translate(-50%,-50%);background:var(--gradient-lightpoint);}
  .dot{position:absolute;left:22%;top:48%;width:12px;height:12px;transform:translate(-50%,-50%);border-radius:999px;background:var(--yellow);box-shadow:0 0 0 5px rgba(255,161,3,.2);}
  .nm{font-size:12px;font-weight:700;}
  .role{font-size:10px;color:var(--fg3);line-height:1.35;}
</style>
</head>
<body>
<div class="wrap">
  <div class="cell"><div class="sw g-brand"></div><div class="nm">Main brand gradient</div><div class="role">Radial Yellow→Burgundy. Hero / brand moments only — not app chrome.</div></div>
  <div class="cell"><div class="sw g-cream"></div><div class="nm">Secondary cream</div><div class="role">A soft, clean pause for product surfaces &amp; landing pages.</div></div>
  <div class="cell"><div class="sw g-lp"><div class="dot"></div></div><div class="nm">Light point</div><div class="role">EAV Yellow pulse — signals one focus, over white/cream/photo only.</div></div>
</div>
</body>
</html>
