<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--fg1);}
  .wrap{padding:22px 28px;display:flex;flex-direction:column;gap:10px;}
  .row{display:flex;align-items:center;gap:12px;}
  .badge{color:#fff;font-size:11px;font-weight:500;padding:3px 10px;border-radius:9999px;}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--fg3);margin-left:auto;}
</style>
</head>
<body>
<div class="wrap">
  <div class="row"><span class="badge" style="background:#1D9E75">Agritech</span><span class="hex">#1D9E75</span></div>
  <div class="row"><span class="badge" style="background:#639922">Innovative Food</span><span class="hex">#639922</span></div>
  <div class="row"><span class="badge" style="background:#EF9F27">Food Logistics &amp; Delivery</span><span class="hex">#EF9F27</span></div>
  <div class="row"><span class="badge" style="background:#D85A30">In-store Retail &amp; Restaurant Tech</span><span class="hex">#D85A30</span></div>
  <div class="row"><span class="badge" style="background:#97C459">Kitchen &amp; Cooking Tech</span><span class="hex">#97C459</span></div>
  <div class="row"><span class="badge" style="background:#7F77DD">Food as a Medicine</span><span class="hex">#7F77DD</span></div>
</div>
</body>
</html>
