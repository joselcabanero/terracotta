<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,300,0,0">
<style>
  html,body{margin:0;background:#fff;color:var(--fg1);font-family:var(--font-sans);}
  .wrap{padding:24px 32px;background:#fff;max-width:640px;display:flex;gap:48px;flex-wrap:wrap;}
  .demo{display:flex;flex-direction:column;gap:0;}
  .cap{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--fg3);margin-bottom:14px;}
  /* trigger button */
  .trigger{font-family:var(--font-sans);font-size:13px;font-weight:500;border-radius:var(--radius-pill);padding:9px 16px;cursor:pointer;border:1px solid var(--red);background:#fff;color:var(--red);display:inline-flex;align-items:center;gap:6px;}
  .trigger .material-symbols-outlined{font-size:18px;}
  /* popover */
  .anchor{position:relative;display:inline-flex;margin-bottom:130px;}
  .popover{position:absolute;top:calc(100% + 8px);left:0;width:200px;background:#fff;border:1px solid var(--border-1);border-radius:var(--radius-md);box-shadow:0 22px 48px -16px rgba(69,14,20,0.22);padding:6px;}
  .pop-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--fg3);padding:6px 8px 4px;}
  .opt{display:flex;align-items:center;gap:9px;padding:8px;border-radius:var(--radius-sm);font-size:13px;color:var(--fg1);cursor:pointer;}
  .opt:hover{background:var(--surface-cream);}
  .av{width:22px;height:22px;border-radius:var(--radius-pill);background:var(--brand-tint);color:var(--red);font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center;}
  /* tooltip */
  .iconbtn{width:36px;height:36px;border-radius:var(--radius-pill);border:1px solid var(--input);background:#fff;color:var(--fg2);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .iconbtn .material-symbols-outlined{font-size:20px;}
  .tip-anchor{position:relative;display:inline-flex;margin-top:54px;}
  .tooltip{position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%);background:#1E1E1E;color:#fff;font-size:12px;line-height:1.3;padding:6px 10px;border-radius:8px;white-space:nowrap;}
  .tooltip::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#1E1E1E;}
</style>
</head>
<body>
<div class="wrap">
  <div class="demo">
    <div class="cap">Popover</div>
    <div class="anchor">
      <button class="trigger"><span class="material-symbols-outlined">person_add</span>Assign owner</button>
      <div class="popover">
        <div class="pop-h">Assign owner</div>
        <div class="opt"><span class="av">EA</span>Elena Arnal</div>
        <div class="opt"><span class="av">JC</span>Jon Capdevila</div>
        <div class="opt"><span class="av">MR</span>Marta Ruiz</div>
      </div>
    </div>
  </div>
  <div class="demo">
    <div class="cap">Tooltip</div>
    <div class="tip-anchor">
      <div class="tooltip">Export pilot report</div>
      <button class="iconbtn"><span class="material-symbols-outlined">download</span></button>
    </div>
  </div>
</div>
</body>
</html>
