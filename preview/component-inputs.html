<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--fg1);font-family:var(--font-sans);}
  .wrap{padding:24px 28px;display:flex;flex-direction:column;gap:14px;}
  .search{position:relative;width:300px;}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--fg4);}
  .search input{width:100%;padding:9px 14px 9px 36px;border:1px solid var(--border-1);border-radius:9999px;font-size:14px;font-family:var(--font-sans);box-sizing:border-box;}
  .search input:focus{outline:none;border-color:var(--black);box-shadow:0 0 0 1px var(--black);}
  .field{display:flex;gap:10px;}
  input.text,select.sel{padding:8px 11px;border:1px solid var(--border-1);border-radius:8px;font-size:14px;font-family:var(--font-sans);box-sizing:border-box;}
  input.text{flex:1;}
  input.text::placeholder{color:var(--fg4);}
  select.sel{width:160px;background:#fff;color:var(--fg2);}
</style>
</head>
<body>
<div class="wrap">
  <div class="search">
    <i data-lucide="search"></i>
    <input placeholder="Search startups, investors..." />
  </div>
  <div class="field">
    <input class="text" placeholder="Filter by technology…" />
    <select class="sel"><option>All sectors</option><option>Agritech</option></select>
  </div>
</div>
<script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons();</script>
</body>
</html>
