<!-- @dsCard group="Brand" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--fg1);font-family:var(--font-sans);}
  .wrap{padding:26px 28px;display:flex;align-items:center;gap:24px;}
  .tile{border-radius:6px;background:var(--brand);color:var(--brand-fg);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:500;}
  .t1{width:32px;height:32px;font-size:11px;}
  .t2{width:48px;height:48px;font-size:16px;border-radius:8px;}
  .t3{width:64px;height:64px;font-size:22px;border-radius:12px;}
  .meta{display:flex;flex-direction:column;gap:6px;margin-left:8px;}
  .meta .nm{font-size:14px;font-weight:600;}
  .meta .note{font-family:var(--font-mono);font-size:10px;color:var(--fg4);}
</style>
</head>
<body>
<div class="wrap">
  <div class="tile t1">EA</div>
  <div class="tile t2">EA</div>
  <div class="tile t3">EA</div>
  <div class="meta">
    <span class="nm">EA monogram</span>
    <span class="note">brand #DE5533 · text #FFF9EE</span>
    <span class="note">IBM Plex Mono · 6–12px radius</span>
  </div>
</div>
</body>
</html>
