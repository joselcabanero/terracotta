<!-- @dsCard group="Brand" name="App mark" subtitle="Compact identity for product surfaces" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--fg1);font-family:var(--font-sans);}
  .wrap{padding:26px 32px;display:flex;align-items:center;gap:28px;}
  .tile{background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;letter-spacing:-0.02em;}
  .t1{width:34px;height:34px;font-size:15px;border-radius:9px;}
  .t2{width:50px;height:50px;font-size:22px;border-radius:13px;}
  .t3{width:74px;height:74px;font-size:33px;border-radius:18px;}
  .meta{display:flex;flex-direction:column;gap:6px;margin-left:8px;}
  .meta .nm{font-size:14px;font-weight:700;}
  .meta .note{font-size:11px;color:var(--fg3);line-height:1.4;}
</style>
</head>
<body>
<div class="wrap">
  <div class="tile t1">EA</div>
  <div class="tile t2">EA</div>
  <div class="tile t3">EA</div>
  <div class="meta">
    <span class="nm">App mark</span>
    <span class="note">EAV Red rounded tile · paper-white "EA" · Rubik bold.<br>For favicons, avatars &amp; compact product chrome — the full wordmark signs everything else.</span>
  </div>
</div>
</body>
</html>
