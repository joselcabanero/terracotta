<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--font-sans);}
  .wrap{padding:26px 32px;display:flex;align-items:center;gap:28px;}
  .tile{background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;letter-spacing:-0.03em;}
  .t1{width:32px;height:32px;font-size:15px;}
  .t2{width:48px;height:48px;font-size:22px;}
  .t3{width:72px;height:72px;font-size:34px;}
  .meta{display:flex;flex-direction:column;gap:5px;margin-left:8px;}
  .meta .nm{font-size:14px;font-weight:700;}
  .meta .note{font-family:var(--font-mono);font-size:10px;color:var(--fg3);}
</style>
</head>
<body>
<div class="wrap">
  <div class="tile t1">EA</div>
  <div class="tile t2">EA</div>
  <div class="tile t3">EA</div>
  <div class="meta">
    <span class="nm">EA monogram</span>
    <span class="note">red #E1251B field · paper text</span>
    <span class="note">grotesk bold · square (0 radius)</span>
  </div>
</div>
</body>
</html>
