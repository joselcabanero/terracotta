<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--fg1);}
  .wrap{padding:24px 28px;display:flex;flex-direction:column;gap:18px;}
  .row{display:flex;align-items:baseline;gap:16px;}
  .tag{font-family:var(--font-mono);font-size:10px;color:var(--fg4);text-transform:uppercase;letter-spacing:.6px;width:130px;flex-shrink:0;}
  .specimen-sans{font-family:var(--font-sans);font-size:34px;font-weight:600;letter-spacing:-0.02em;}
  .specimen-mono{font-family:var(--font-mono);font-size:26px;font-weight:500;}
  .meta{font-size:12px;color:var(--fg3);}
  .glyphs{font-family:var(--font-sans);font-size:18px;color:var(--fg2);letter-spacing:.04em;}
</style>
</head>
<body>
<div class="wrap">
  <div class="row">
    <div class="tag">Inter · UI</div>
    <div>
      <div class="specimen-sans">Startup Intelligence</div>
      <div class="meta">Inter — 400 / 500 / 600 / 700 · feature settings cv11, ss01</div>
    </div>
  </div>
  <div class="row">
    <div class="tag">IBM Plex Mono</div>
    <div>
      <div class="specimen-mono">Ecosystem&nbsp;DB&nbsp;·&nbsp;2026</div>
      <div class="meta">IBM Plex Mono — 400 / 500 · labels, monogram, numerics</div>
    </div>
  </div>
  <div class="row">
    <div class="tag">Glyphs</div>
    <div class="glyphs">ABCDEFGcdefg 0123456789 &nbsp; — → ·</div>
  </div>
</div>
</body>
</html>
