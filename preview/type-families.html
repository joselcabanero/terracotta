<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--ink);}
  .wrap{padding:26px 32px;display:flex;flex-direction:column;gap:16px;}
  .row{display:flex;align-items:baseline;gap:20px;border-top:2px solid var(--ink);padding-top:12px;}
  .tag{font-family:var(--font-mono);font-size:10px;color:var(--fg3);text-transform:uppercase;letter-spacing:.1em;width:140px;flex-shrink:0;line-height:1.4;}
  .big{font-family:var(--font-sans);font-size:40px;font-weight:700;letter-spacing:-0.025em;line-height:1;}
  .mono{font-family:var(--font-mono);font-size:24px;font-weight:500;}
</style>
</head>
<body>
<div class="wrap">
  <div class="row">
    <div class="tag">Grotesk · UI<br>Helvetica / Arial</div>
    <div class="big">Grotesk Neue 1957</div>
  </div>
  <div class="row">
    <div class="tag">Mono · numerals<br>IBM Plex Mono</div>
    <div class="mono">0123456789 — →</div>
  </div>
</div>
</body>
</html>
