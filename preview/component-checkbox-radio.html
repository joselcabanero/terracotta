<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,300,0,0">
<style>
  html,body{margin:0;background:#fff;color:var(--fg1);font-family:var(--font-sans);}
  .wrap{padding:24px 32px;display:flex;flex-direction:column;gap:24px;max-width:560px;}
  .group{display:flex;flex-direction:column;gap:10px;}
  .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--fg2);margin-bottom:2px;}
  .opt{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--fg1);}
  .opt.disabled{opacity:.4;cursor:not-allowed;}

  /* checkbox */
  .check{width:19px;height:19px;border:1px solid var(--input);border-radius:6px;background:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none;}
  .check.on{background:var(--red);border-color:var(--red);}
  .check .material-symbols-outlined{font-size:15px;color:#fff;font-variation-settings:'wght' 600;display:none;}
  .check.on .material-symbols-outlined{display:block;}

  /* radio */
  .radio{width:19px;height:19px;border:1px solid var(--input);border-radius:999px;background:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none;}
  .radio.on{border-color:var(--red);}
  .radio .dot{width:9px;height:9px;border-radius:999px;background:var(--red);display:none;}
  .radio.on .dot{display:block;}

  /* toggle */
  .togrow{display:flex;align-items:center;gap:8px;font-size:14px;}
  .switch{width:38px;height:22px;border-radius:999px;background:var(--input);position:relative;flex:none;transition:background .15s;}
  .switch.on{background:var(--red);}
  .switch .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:999px;background:#fff;box-shadow:var(--shadow-sm);transition:left .15s;}
  .switch.on .knob{left:18px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="group">
    <div class="lbl">Sectors of interest</div>
    <label class="opt"><span class="check on"><span class="material-symbols-outlined">check</span></span>Agritech</label>
    <label class="opt"><span class="check"></span>Alternative proteins</label>
    <label class="opt"><span class="check"></span>Food packaging</label>
    <label class="opt disabled"><span class="check"></span>Pet food (coming soon)</label>
  </div>

  <div class="group">
    <div class="lbl">Pilot stage</div>
    <label class="opt"><span class="radio on"><span class="dot"></span></span>Discovery</label>
    <label class="opt"><span class="radio"><span class="dot"></span></span>Validation</label>
    <label class="opt"><span class="radio"><span class="dot"></span></span>Scale-up</label>
  </div>

  <div class="group">
    <div class="lbl">Notifications</div>
    <div class="togrow"><span class="switch on"><span class="knob"></span></span>New startup matches</div>
    <div class="togrow"><span class="switch"><span class="knob"></span></span>Weekly hub digest</div>
    <div class="togrow opt disabled"><span class="switch"><span class="knob"></span></span>SMS alerts (disabled)</div>
  </div>
</div>
</body>
</html>
