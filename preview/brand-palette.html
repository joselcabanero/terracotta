<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--fg1);font-family:var(--font-sans);}
  .wrap{padding:24px 28px;}
  .scale{display:flex;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-1);}
  .sw{flex:1;height:84px;}
  .labels{display:flex;margin-top:8px;}
  .lb{flex:1;font-size:9.5px;color:var(--fg3);text-align:center;line-height:1.5;}
  .lb b{display:block;color:var(--fg1);font-weight:700;font-size:10px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="scale">
    <div class="sw" style="background:#FFFFFF;border-right:1px solid var(--border-1)"></div>
    <div class="sw" style="background:#FFF9EE"></div>
    <div class="sw" style="background:#F5EACE"></div>
    <div class="sw" style="background:#FFA103"></div>
    <div class="sw" style="background:#DE5533"></div>
    <div class="sw" style="background:#BC2D29"></div>
    <div class="sw" style="background:#450E14"></div>
    <div class="sw" style="background:#1E1E1E"></div>
  </div>
  <div class="labels">
    <div class="lb"><b>White</b>#FFFFFF</div>
    <div class="lb"><b>Cream</b>#FFF9EE</div>
    <div class="lb"><b>Dark Cream</b>#F5EACE</div>
    <div class="lb"><b>Yellow</b>#FFA103</div>
    <div class="lb"><b>Orange</b>#DE5533</div>
    <div class="lb"><b>Red</b>#BC2D29</div>
    <div class="lb"><b>Burgundy</b>#450E14</div>
    <div class="lb"><b>Black</b>#1E1E1E</div>
  </div>
</div>
</body>
</html>
