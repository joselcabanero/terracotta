<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,300,0,0">
<style>
  html,body{margin:0;background:#fff;color:var(--fg1);font-family:var(--font-sans);}
  .wrap{padding:24px 32px;display:flex;flex-direction:column;gap:18px;}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .cap{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--fg3);width:78px;}
  .pill{font-size:11px;font-weight:500;padding:4px 12px;border-radius:var(--radius-pill);display:inline-flex;align-items:center;gap:6px;}
  .p-red{background:var(--red);color:#fff;}
  .p-cream{background:var(--surface-cream);color:var(--fg1);border:1px solid var(--border-2);}
  .p-outline{border:1px solid var(--input);color:var(--fg2);background:#fff;}
  .p-burg{background:var(--burgundy);color:#FFF9EE;}
  .dot{width:7px;height:7px;border-radius:999px;display:inline-block;}
  .live .dot{background:#fff;}
  .material-symbols-outlined{font-size:14px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="row"><span class="cap">status</span>
    <span class="pill p-red live"><span class="dot"></span>Live</span>
    <span class="pill p-cream">In progress</span>
    <span class="pill p-outline">Draft</span>
    <span class="pill p-burg">Closed</span>
  </div>
  <div class="row"><span class="cap">tag</span>
    <span class="pill p-outline"><span class="material-symbols-outlined">factory</span>Pilot</span>
    <span class="pill p-outline"><span class="material-symbols-outlined">science</span>Validation</span>
    <span class="pill p-outline"><span class="material-symbols-outlined">public</span>Europe</span>
  </div>
</div>
</body>
</html>
