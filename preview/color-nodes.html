<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--fg1);}
  .wrap{padding:24px 28px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .node{display:flex;flex-direction:column;gap:8px;align-items:center;}
  .dot{width:46px;height:46px;border-radius:9999px;}
  .nm{font-size:12px;font-weight:600;}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--fg3);}
</style>
</head>
<body>
<div class="wrap">
  <div class="node"><div class="dot" style="background:#2563eb"></div><div class="nm">Startup</div><div class="hex">#2563eb</div></div>
  <div class="node"><div class="dot" style="background:#16a34a"></div><div class="nm">Investor</div><div class="hex">#16a34a</div></div>
  <div class="node"><div class="dot" style="background:#9333ea"></div><div class="nm">Person</div><div class="hex">#9333ea</div></div>
  <div class="node"><div class="dot" style="background:#ea580c"></div><div class="nm">Corporate</div><div class="hex">#ea580c</div></div>
</div>
</body>
</html>
