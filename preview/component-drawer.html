<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,300,0,0">
<style>
  html,body{margin:0;background:#fff;color:var(--fg1);font-family:var(--font-sans);}
  .wrap{padding:24px 32px;background:#fff;max-width:640px;}
  .frame{position:relative;height:380px;border:1px solid var(--border-1);border-radius:var(--radius-md);overflow:hidden;background:var(--surface-grey);}
  /* faint page behind */
  .page{padding:18px;opacity:.55;}
  .page .bar{height:10px;border-radius:var(--radius-pill);background:var(--border-1);margin-bottom:10px;}
  .page .bar.s{width:40%;} .page .bar.m{width:70%;} .page .bar.l{width:90%;}
  .scrim{position:absolute;inset:0;background:rgba(30,30,30,.35);}
  .drawer{position:absolute;top:0;right:0;bottom:0;width:360px;max-width:90%;background:#fff;border-left:1px solid var(--border-1);box-shadow:-22px 0 48px -16px rgba(69,14,20,0.22);display:flex;flex-direction:column;}
  .dhead{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border-2);}
  .dhead .t{font-size:16px;font-weight:500;letter-spacing:-0.01em;}
  .close{border:none;background:none;color:var(--fg3);cursor:pointer;display:flex;}
  .close .material-symbols-outlined{font-size:20px;}
  .dbody{padding:6px 20px;flex:1;overflow:auto;}
  .row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:13px 0;border-bottom:1px solid var(--border-2);}
  .row .k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--fg3);}
  .row .v{font-size:14px;color:var(--fg1);text-align:right;}
  .pill{font-size:11px;font-weight:500;padding:4px 12px;border-radius:var(--radius-pill);display:inline-flex;align-items:center;gap:6px;background:var(--red);color:#fff;}
  .pill .dot{width:7px;height:7px;border-radius:999px;background:#fff;}
  .dfoot{padding:16px 20px;border-top:1px solid var(--border-2);}
  .btn{width:100%;font-family:var(--font-sans);font-size:13px;font-weight:500;border-radius:var(--radius-pill);padding:11px 18px;cursor:pointer;border:1px solid var(--red);background:#fff;color:var(--red);box-sizing:border-box;}
</style>
</head>
<body>
<div class="wrap">
  <div class="frame">
    <div class="page">
      <div class="bar l"></div><div class="bar m"></div><div class="bar l"></div>
      <div class="bar s"></div><div class="bar m"></div><div class="bar l"></div>
      <div class="bar m"></div><div class="bar s"></div>
    </div>
    <div class="scrim"></div>
    <aside class="drawer">
      <div class="dhead">
        <div class="t">Startup detail</div>
        <button class="close"><span class="material-symbols-outlined">close</span></button>
      </div>
      <div class="dbody">
        <div class="row"><span class="k">Name</span><span class="v">Mycorena</span></div>
        <div class="row"><span class="k">Sector</span><span class="v">Innovative food</span></div>
        <div class="row"><span class="k">Stage</span><span class="v">Series A</span></div>
        <div class="row"><span class="k">HQ</span><span class="v">Gothenburg, SE</span></div>
        <div class="row"><span class="k">Status</span><span class="v"><span class="pill"><span class="dot"></span>In pilot</span></span></div>
      </div>
      <div class="dfoot">
        <button class="btn">Open full profile</button>
      </div>
    </aside>
  </div>
</div>
</body>
</html>
