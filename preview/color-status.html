<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--font-sans);}
  .wrap{padding:24px 32px;display:flex;flex-direction:column;gap:18px;}
  .grp{display:flex;flex-direction:column;gap:9px;}
  .cap{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--fg3);}
  .tags{display:flex;gap:8px;flex-wrap:wrap;}
  .tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;border:1px solid #111;color:#111;background:#fff;}
  .tag.live{background:#E1251B;color:#fff;border-color:#E1251B;}
  .scores{display:flex;gap:18px;align-items:baseline;}
  .score{font-variant-numeric:tabular-nums;}
  .score .n{font-size:24px;letter-spacing:-0.02em;}
  .score .c{font-family:var(--font-mono);font-size:10px;color:var(--fg3);margin-left:6px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="grp">
    <span class="cap">News / category tags — monochrome, red marks "live"</span>
    <div class="tags">
      <span class="tag live">Funding</span>
      <span class="tag">Technology</span>
      <span class="tag">Market</span>
      <span class="tag">Policy</span>
      <span class="tag">People</span>
    </div>
  </div>
  <div class="grp">
    <span class="cap">Match score — hierarchy by weight, not hue</span>
    <div class="scores">
      <span class="score"><span class="n" style="font-weight:700;">87</span><span class="c">high</span></span>
      <span class="score"><span class="n" style="font-weight:500;color:#6F6F6F;">44</span><span class="c">mid</span></span>
      <span class="score"><span class="n" style="font-weight:400;color:#9B9B9B;">12</span><span class="c">low</span></span>
    </div>
  </div>
</div>
</body>
</html>
