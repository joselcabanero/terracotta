<!-- @dsCard group="Colors" name="Typography & color" subtitle="Approved text / background pairings" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--fg1);font-family:var(--font-sans);}
  .wrap{padding:24px 32px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .cell{border-radius:var(--radius-md);padding:16px;min-height:88px;display:flex;flex-direction:column;justify-content:center;gap:6px;overflow:hidden;position:relative;}
  .c-white{background:#fff;border:1px solid var(--border-1);}
  .c-cream{background:#FFF9EE;}
  .c-red{background:#BC2D29;}
  .c-burg{background:#450E14;}
  .hl{font-size:18px;font-weight:400;letter-spacing:-0.01em;line-height:1.2;}
  .hl b{font-weight:700;}
  .bd{font-size:12px;line-height:1.4;}
  .tag{font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;opacity:.7;}
</style>
</head>
<body>
<div class="wrap">
  <div class="cell c-white"><span class="tag" style="color:var(--fg3)">on white</span><span class="hl" style="color:#1E1E1E">Black text, <span style="color:#BC2D29;font-weight:700">red</span> word</span><span class="bd" style="color:#574E48">EAV Black body text</span></div>
  <div class="cell c-cream"><span class="tag" style="color:var(--fg3)">on cream</span><span class="hl" style="color:#1E1E1E">Black on <b>cream</b></span><span class="bd" style="color:#574E48">Highlighted editorial block</span></div>
  <div class="cell c-red"><span class="tag" style="color:#fff">on red</span><span class="hl" style="color:#FFF9EE">Cream headline</span><span class="bd" style="color:#fff">White body text</span></div>
  <div class="cell c-burg"><span class="tag" style="color:#F5EACE">on burgundy</span><span class="hl" style="color:#FFF9EE">Cream on burgundy</span><span class="bd" style="color:#fff">Closing / depth moment</span></div>
</div>
</body>
</html>
