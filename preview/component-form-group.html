<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,300,0,0">
<style>
  html,body{margin:0;background:#fff;color:var(--fg1);font-family:var(--font-sans);}
  .wrap{padding:24px 32px;display:flex;flex-direction:column;gap:24px;max-width:520px;}
  .field{display:flex;flex-direction:column;}
  label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--fg2);margin-bottom:6px;}
  label .req{color:var(--red);margin-left:2px;}
  .input{padding:10px 13px;border:1px solid var(--input);border-radius:var(--radius-md);background:#fff;font-size:14px;color:var(--fg1);}
  .input.placeholder{color:var(--fg4);}
  .input.error{border-color:var(--red);}
  .input.disabled{opacity:.4;cursor:not-allowed;background:var(--surface-grey);}
  .help{font-size:12px;color:var(--fg3);margin-top:6px;}
  .err{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--red);margin-top:6px;}
  .err .material-symbols-outlined{font-size:15px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="field">
    <label>Project name</label>
    <div class="input">Iberia Agritech Pilot 2026</div>
    <div class="help">Shown on dashboards and partner reports.</div>
  </div>

  <div class="field">
    <label>Lead hub<span class="req">*</span></label>
    <div class="input">Madrid Food Hub</div>
    <div class="help">Required — owns the operational pilot.</div>
  </div>

  <div class="field">
    <label>Sector<span class="req">*</span></label>
    <div class="input error placeholder">Select a sector…</div>
    <div class="err"><span class="material-symbols-outlined">error</span>This field is required</div>
  </div>

  <div class="field">
    <label>Internal pilot ID</label>
    <div class="input disabled">EAV-2026-0418</div>
    <div class="help">Generated automatically — cannot be edited.</div>
  </div>
</div>
</body>
</html>
