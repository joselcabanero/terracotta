<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--font-sans);}
  .wrap{padding:24px 32px;display:flex;flex-direction:column;gap:16px;}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  button{font-family:var(--font-sans);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:1px solid transparent;border-radius:0;white-space:nowrap;transition:background .12s,color .12s,border-color .12s;}
  .btn-primary{background:#111;color:#fff;padding:9px 16px;}
  .btn-primary:hover{background:#000;}
  .btn-outline{background:#fff;color:#111;border-color:#111;padding:9px 16px;}
  .btn-outline:hover{background:#F4F4F2;}
  .btn-ghost{background:transparent;color:#4A4A4A;padding:9px 14px;}
  .btn-ghost:hover{background:#EAEAEA;color:#111;}
  .btn-red{background:#E1251B;color:#fff;padding:9px 16px;}
  .btn-red:hover{background:#B71C13;}
  .btn-sm{font-size:12px;padding:7px 12px;border:1px solid #111;background:#fff;color:#111;}
  .btn-sm:hover{background:#F4F4F2;}
  .cap{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--fg3);}
  svg{width:16px;height:16px;}
  .btn-sm svg{width:13px;height:13px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="row">
    <button class="btn-primary"><i data-lucide="plus"></i>Add Startup</button>
    <button class="btn-outline">Cancel</button>
    <button class="btn-ghost">View all</button>
    <button class="btn-red"><i data-lucide="trash-2"></i>Delete</button>
  </div>
  <div class="row">
    <span class="cap">small / secondary</span>
    <button class="btn-sm"><i data-lucide="sliders-horizontal"></i>Filters</button>
    <button class="btn-sm"><i data-lucide="download"></i>Export</button>
    <button class="btn-sm"><i data-lucide="bookmark"></i>Save filter</button>
  </div>
</div>
<script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons();</script>
</body>
</html>
